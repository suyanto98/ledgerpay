version: "2"

# Satu package hasil generate per modul: modul hanya memegang query untuk tabel miliknya (ADR-001).
overrides:
  go:
    overrides:
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
      - db_type: uuid
        nullable: true
        go_type:
          import: github.com/google/uuid
          type: UUID
          pointer: true
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          import: time
          type: Time
          pointer: true
      - db_type: inet
        nullable: true
        go_type:
          import: net/netip
          type: Addr
          pointer: true

sql:
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/identity.sql
    gen:
      go:
        package: store
        out: internal/modules/identity/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/ledger.sql
    gen:
      go:
        package: store
        out: internal/modules/ledger/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/idempotency.sql
    gen:
      go:
        package: store
        out: internal/platform/idempotency/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/transfer.sql
    gen:
      go:
        package: store
        out: internal/modules/transfer/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/merchant.sql
    gen:
      go:
        package: store
        out: internal/modules/merchant/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
  - engine: postgresql
    schema: db/migrations
    queries: db/queries/payment.sql
    gen:
      go:
        package: store
        out: internal/modules/payment/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
