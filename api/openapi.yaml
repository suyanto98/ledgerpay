openapi: 3.1.0
info:
  title: LedgerPay API
  version: 0.6.0
  summary: Mini payment platform with a double-entry ledger.
  description: |
    Spec-first contract (ADR-003). Sprint 0 skeleton covering Sprint 1–3 paths
    (auth, wallet, transfers). Conventions: docs/design/11-api-conventions.md.

    - Money is always a **string** of integer minor units (IDR exponent 2): "5000000" = Rp50.000,00 (ADR-L04).
    - Errors use RFC 9457 `application/problem+json` with a stable `code` (docs/design/12-api-error-catalogue.md).
    - Money-moving endpoints require the `Idempotency-Key` header (ADR-L02).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
    description: Relative to the host serving the SPA (Caddy routes /api/* to the API)

tags:
  - name: auth
    description: Registration, login, and session management (ADR-009).
  - name: wallet
    description: Wallet balance and transaction history (LF-02).
  - name: transfers
    description: Peer-to-peer transfers (LF-04, LF-05).
  - name: checkout
    description: A user pays a merchant's payment intent (LF-10).
  - name: merchant
    description: Merchant API, authenticated with an API key (LF-09, LF-10).
  - name: ops
    description: Operator actions, role OPS only. Every write is audited.
  - name: topups
    description: Wallet top-up through the payment provider (LF-07). Balance changes only via verified webhooks.
  - name: webhooks
    description: Inbound provider webhooks (ADR-L08). Authenticated by HMAC signature, not by JWT.
  - name: payouts
    description: Withdraw to a bank account (LF-11). The outcome may be temporarily unknown (ADR-L06).

security:
  - userJWT: []

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register a user and create their IDR wallet
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: User and wallet created in one transaction.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with email and password
      description: |
        Returns a short-lived access token in the body and sets the refresh token
        as an HttpOnly cookie. Locked accounts get the same response as wrong
        credentials (no account enumeration): after 5 wrong passwords the account is
        locked for 1 minute, doubling up to 15 minutes; the locked response is a plain
        401 INVALID_CREDENTIALS without Retry-After. Rate limited to 5/min and 20/h per
        (IP, email), also for unknown emails.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in.
          headers:
            Set-Cookie:
              description: Refresh token cookie (HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessToken' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      description: |
        Rotation with reuse detection (ADR-009, C-05):
        - unused token → new access token + new refresh cookie (same family);
        - token already used within the last 10 s (parallel refresh from two tabs) → new access
          token only, no new cookie (the browser already holds the successor);
        - token used more than 10 s ago → treated as stolen: the whole family is revoked,
          401 REFRESH_TOKEN_REUSED, cookie cleared.
        A family can never outlive 30 days from login. CSRF guard: `X-Requested-With: fetch`
        is required and `Origin`, when sent, must be an allowed origin (403 otherwise).
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: Session refreshed; a new refresh cookie is set unless within the grace window.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessToken' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the whole session family of the current refresh token
      description: Always 204 (an invalid or missing cookie still "logs out") and always clears the cookie.
      security:
        - refreshCookie: []
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '204':
          description: Logged out.
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Get the authenticated user
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /wallet:
    get:
      tags: [wallet]
      operationId: getWallet
      summary: Get the caller's wallet balance
      responses:
        '200':
          description: Wallet with current balance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /wallet/transactions:
    get:
      tags: [wallet]
      operationId: listWalletTransactions
      summary: List the caller's wallet transactions (newest first)
      description: |
        Entries of the caller's wallet only. Unknown query parameters are rejected (400).
        Direction is from the wallet's point of view: credit to the wallet (a liability) = IN.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: type
          in: query
          required: false
          description: Repeatable (?type=TOPUP&type=PAYMENT).
          schema:
            type: array
            items: { type: string, enum: [TOPUP, TRANSFER, PAYMENT, REFUND, PAYOUT, ADJUSTMENT] }
          style: form
          explode: true
        - name: direction
          in: query
          required: false
          schema: { type: string, enum: [IN, OUT] }
        - name: from
          in: query
          required: false
          description: Inclusive date in Asia/Jakarta (YYYY-MM-DD); range at most 366 days.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          description: Inclusive date in Asia/Jakarta (YYYY-MM-DD).
          schema: { type: string, format: date }
      responses:
        '200':
          description: One page of transactions.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WalletTransaction' }
                  page: { $ref: '#/components/schemas/Page' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /wallet/transactions/{id}:
    get:
      tags: [wallet]
      operationId: getWalletTransaction
      summary: Get one wallet transaction
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Transaction detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletTransactionDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /transfers:
    post:
      tags: [transfers]
      operationId: createTransfer
      summary: Transfer money to another user
      description: |
        One DB transaction: idempotency key insert → lock both wallets in id order
        (FOR NO KEY UPDATE) → balance check → balanced journal → transfer row (ADR-L02, ADR-L03).

        Idempotency: same key + same payload (canonical JSON: key order and whitespace ignored)
        replays the stored response with `Idempotent-Replayed: true`. Stored: 201 and every 422
        domain rejection. Not stored: 400, 409, 5xx — retrying with the same key is safe.
        A concurrent request with the same key waits for the first; if it waits longer than
        2 s it gets 409 REQUEST_IN_PROGRESS. Keys expire after 7 days.

        Unknown email, inactive user and frozen recipient wallet all return the same
        422 INVALID_RECIPIENT (anti-enumeration).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTransferRequest' }
      responses:
        '201':
          description: Transfer completed (or replayed — see Idempotent-Replayed header).
          headers:
            Idempotent-Replayed:
              description: Present with value `true` when this is a replayed response.
              schema: { type: string, enum: ['true'] }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /transfers/{id}:
    get:
      tags: [transfers]
      operationId: getTransfer
      summary: Get a transfer (sender or receiver only)
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Transfer detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transfer' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payment-intents/{id}:
    get:
      tags: [checkout]
      operationId: getPaymentIntentForUser
      summary: View a payment intent (capability URL before payment, payer only after)
      description: |
        Before payment any logged-in user holding the id may view it (checkout data only).
        After payment only the payer may view it; anyone else gets 404. A REQUIRES_CONFIRMATION
        intent past `expires_at` is shown as EXPIRED even before the sweeper marks it.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Payment intent (payer view or pre-payment view).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /payment-intents/{id}/confirm:
    post:
      tags: [checkout]
      operationId: confirmPaymentIntent
      summary: Pay a payment intent from the caller's wallet
      description: |
        One transaction: idempotency key → lock intent (FOR UPDATE) → check status and expiry
        (now() = transaction start) → lock wallets in id order → PAYMENT journal → SUCCEEDED.
        The amount is never sent by the client. Two tabs confirming at once with different keys:
        one 200, one 409 INVALID_STATE_TRANSITION. Stored for replay: 200 and 422.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Paid (or replayed — see Idempotent-Replayed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /merchant/payment-intents:
    post:
      tags: [merchant]
      operationId: createPaymentIntent
      summary: Create a payment intent
      description: |
        Idempotent per merchant (client_type MERCHANT): a retry with the same key replays 201.
        The same merchant_order_id with a different key while an intent is live →
        409 DUPLICATE_MERCHANT_ORDER with `existing_resource_id`.
      security:
        - merchantApiKey: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentIntentRequest' }
      responses:
        '201':
          description: Created (or replayed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /merchant/payment-intents/{id}:
    get:
      tags: [merchant]
      operationId: getPaymentIntentForMerchant
      summary: Get one of the caller's payment intents (source of truth for polling)
      security:
        - merchantApiKey: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Merchant view.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentIntent' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /merchant/payment-intents/{id}/refunds:
    post:
      tags: [merchant]
      operationId: refundPaymentIntent
      summary: Refund a paid intent, partially or fully (LF-16)
      description: |
        One transaction: key → intent FOR UPDATE → wallets (ORDER BY id) → journal REFUND →
        refunded_amount/status → outbox `payment.refunded`. Parallel refunds are serialized by the
        intent lock, so Σ refunds can never exceed the payment (LI-08). Stored for replay: 201 and
        domain 422s (REFUND_EXCEEDS_PAYMENT with `refundable_amount`, INSUFFICIENT_BALANCE of the merchant).
      security:
        - merchantApiKey: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                reason: { type: string, maxLength: 200 }
      responses:
        '201':
          description: Refund created (or replayed).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Refund'
                  - type: object
                    required: [payment_intent]
                    properties:
                      payment_intent:
                        type: object
                        required: [id, status, refunded_amount]
                        properties:
                          id: { type: string, format: uuid }
                          status: { type: string, enum: [PARTIALLY_REFUNDED, REFUNDED] }
                          refunded_amount: { $ref: '#/components/schemas/Money' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /merchant/balance:
    get:
      tags: [merchant]
      operationId: getMerchantBalance
      summary: Balance of the caller's merchant wallet (read from the primary)
      security:
        - merchantApiKey: []
      responses:
        '200':
          description: Balance.
          content:
            application/json:
              schema:
                type: object
                required: [account_id, balance, currency, as_of]
                properties:
                  account_id: { type: string, format: uuid }
                  balance: { $ref: '#/components/schemas/Money' }
                  currency: { $ref: '#/components/schemas/Currency' }
                  as_of: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /ops/transactions/search:
    get:
      tags: [ops]
      operationId: opsSearch
      summary: Precise search by object/journal id, email, provider_ref or merchant_order_id (max 50)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        '200':
          description: Matching business objects (newest first).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [object_type, id, status, amount, currency, journal_ids, created_at]
                      properties:
                        object_type: { type: string, enum: [transfer, topup, payout, payment_intent, refund] }
                        id: { type: string, format: uuid }
                        status: { type: string }
                        amount: { $ref: '#/components/schemas/Money' }
                        currency: { $ref: '#/components/schemas/Currency' }
                        user:
                          type: [object, 'null']
                          properties:
                            id: { type: string, format: uuid }
                            email: { type: string }
                        journal_ids: { type: array, items: { type: string, format: uuid } }
                        correlation_id: { type: [string, 'null'] }
                        created_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /ops/journals/{id}:
    get:
      tags: [ops]
      operationId: opsGetJournal
      summary: Journal with entries and account owners
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Journal.
          content:
            application/json:
              schema:
                type: object
                required: [id, purpose, source_type, source_id, actor_type, correlation_id, created_at, entries]
                properties:
                  id: { type: string, format: uuid }
                  purpose: { type: string }
                  source_type: { type: string }
                  source_id: { type: string, format: uuid }
                  reversal_of: { type: [string, 'null'], format: uuid }
                  reversed_by: { type: [string, 'null'], format: uuid }
                  actor_type: { type: string, enum: [USER, MERCHANT, OPS, SYSTEM] }
                  actor_id: { type: [string, 'null'], format: uuid }
                  correlation_id: { type: string }
                  description: { type: [string, 'null'] }
                  currency: { $ref: '#/components/schemas/Currency' }
                  created_at: { type: string, format: date-time }
                  entries:
                    type: array
                    items:
                      type: object
                      required: [account_id, owner, direction, amount, currency]
                      properties:
                        account_id: { type: string, format: uuid }
                        owner: { type: string, examples: ['USER:rina@example.com', 'MERCHANT:Kopi Budi', 'PAYOUT_IN_TRANSIT'] }
                        direction: { type: string, enum: [D, C] }
                        amount: { $ref: '#/components/schemas/Money' }
                        currency: { $ref: '#/components/schemas/Currency' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ops/payouts:
    get:
      tags: [ops]
      operationId: opsListPayouts
      summary: Payout queue for ops (oldest first), e.g. ?status=UNKNOWN&needs_reconciliation=true
      parameters:
        - { name: status, in: query, required: false, explode: true, schema: { type: array, items: { type: string, enum: [PENDING, SUBMITTED, UNKNOWN, SUCCEEDED, FAILED] } } }
        - { name: needs_reconciliation, in: query, required: false, schema: { type: boolean } }
        - { name: older_than_minutes, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 129600 } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of payouts with ops fields.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/OpsPayout' } }
                  page: { $ref: '#/components/schemas/Page' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /ops/payouts/{id}:
    get:
      tags: [ops]
      operationId: opsGetPayout
      summary: One payout with ops fields
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Payout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpsPayout' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /ops/payouts/{id}/resolve:
    post:
      tags: [ops]
      operationId: opsResolvePayout
      summary: Manually resolve an UNKNOWN/SUBMITTED payout with evidence (ADR-L06)
      description: |
        One transaction: guard + lock payout → journal PAYOUT_SETTLE or PAYOUT_REVERSAL (never a
        balance edit) → audit `payout.manual_resolve` with the evidence. Losing a race against an
        automatic status check → 409 INVALID_STATE_TRANSITION, nothing posted.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outcome, evidence_ref, reason]
              properties:
                outcome: { type: string, enum: [SUCCEEDED, FAILED] }
                evidence_ref: { type: string, minLength: 3, maxLength: 200, examples: ['MOCKBANK-STMT-2026-10-04#L42'] }
                reason: { type: string, minLength: 10 }
      responses:
        '200':
          description: Resolved payout (resolution_source = OPS).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpsPayout' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /ops/jobs:
    get:
      tags: [ops]
      operationId: opsListJobs
      summary: Jobs by status (default dead), without payloads
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [queued, running, succeeded, dead], default: dead } }
        - { name: kind, in: query, required: false, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of jobs (newest first).
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/OpsJob' } }
                  page: { $ref: '#/components/schemas/Page' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /ops/jobs/{id}/retry:
    post:
      tags: [ops]
      operationId: opsRetryJob
      summary: Put a dead job back in the queue (attempts reset; audited)
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpsReason' }
      responses:
        '200':
          description: Job queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpsJob' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /ops/webhook-deliveries:
    get:
      tags: [ops]
      operationId: opsListWebhookDeliveries
      summary: Outbound webhook deliveries by status (default DEAD), without payloads
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [PENDING, DELIVERED, DEAD], default: DEAD } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of deliveries (newest first).
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, merchant, event_id, event_type, status, attempts, created_at]
                      properties:
                        id: { type: string, format: uuid }
                        merchant: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string } } }
                        event_id: { type: string, format: uuid }
                        event_type: { type: string, enum: [payment.succeeded, payment.refunded, payment.expired] }
                        status: { type: string, enum: [PENDING, DELIVERED, DEAD] }
                        attempts: { type: integer }
                        last_status_code: { type: [integer, 'null'] }
                        last_error: { type: [string, 'null'] }
                        last_attempt_at: { type: [string, 'null'], format: date-time }
                        created_at: { type: string, format: date-time }
                  page: { $ref: '#/components/schemas/Page' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /ops/webhook-deliveries/{id}/replay:
    post:
      tags: [ops]
      operationId: opsReplayWebhookDelivery
      summary: Replay a DEAD delivery (same event_id so the merchant can dedupe; audited)
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpsReason' }
      responses:
        '202':
          description: Delivery queued again.
          content:
            application/json:
              schema:
                type: object
                required: [id, event_id, status]
                properties:
                  id: { type: string, format: uuid }
                  event_id: { type: string, format: uuid }
                  status: { type: string, enum: [PENDING] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /ops/recon-runs:
    get:
      tags: [ops]
      operationId: opsListReconRuns
      summary: Reconciliation runs (newest first)
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of runs.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ReconRun' } }
                  page: { $ref: '#/components/schemas/Page' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [ops]
      operationId: opsCreateReconRun
      summary: Reconcile one business date against the provider settlement file (LF-17)
      description: |
        V1 runs synchronously (small files): fetch the settlement CSV, hash it, classify every row,
        post PROVIDER_SETTLEMENT for matched top-ups (deduplicated per top-up) and queue mismatches.
        The same file for the same date is never processed twice (uq_recon_runs_file): 200 returns
        the existing run. A malformed file yields a FAILED run without items.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [business_date]
              properties:
                business_date: { type: string, format: date, description: 'Asia/Jakarta, not in the future' }
                source: { type: string, enum: [PULL], default: PULL }
      responses:
        '201':
          description: New run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconRun' }
        '200':
          description: This exact file was already processed for that date.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconRun' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: SERVICE_UNAVAILABLE — the settlement file could not be fetched.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /ops/recon-items:
    get:
      tags: [ops]
      operationId: opsListReconItems
      summary: Reconciliation items, e.g. ?resolution=OPEN (investigation queue, oldest first)
      parameters:
        - { name: resolution, in: query, required: false, schema: { type: string, enum: [OPEN, RESOLVED] } }
        - { name: category, in: query, required: false, explode: true, schema: { type: array, items: { type: string, enum: [MATCHED, MISSING_INTERNAL, MISSING_EXTERNAL, AMOUNT_MISMATCH, STATUS_MISMATCH] } } }
        - { name: recon_run_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: object_type, in: query, required: false, schema: { type: string, enum: [topup, payout] } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of items.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ReconItem' } }
                  page: { $ref: '#/components/schemas/Page' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /ops/recon-items/{id}/resolve:
    post:
      tags: [ops]
      operationId: opsResolveReconItem
      summary: Resolve an OPEN item with evidence (Demo D)
      description: |
        The action must match the item: APPLY_PAYOUT_SETTLE only for a payout STATUS_MISMATCH whose
        provider status is SUCCEEDED; APPLY_PAYOUT_REVERSAL for provider FAILED or MISSING_EXTERNAL.
        APPLY_* uses the same guarded journal path as a manual payout resolution, in one transaction
        with the item resolution and audit rows.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, evidence_ref, reason]
              properties:
                action: { type: string, enum: [APPLY_PAYOUT_SETTLE, APPLY_PAYOUT_REVERSAL, NO_ACTION_TIMING, NO_ACTION_PROVIDER_ERROR] }
                evidence_ref: { type: string, minLength: 3, maxLength: 200 }
                reason: { type: string, minLength: 10 }
      responses:
        '200':
          description: Resolved item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconItem' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /ops/merchants/{id}/api-keys:
    post:
      tags: [ops]
      operationId: createMerchantApiKey
      summary: Issue an API key in a free slot (max two active keys)
      description: |
        The secret is returned only once. A replay with the same Idempotency-Key returns the same
        key id with `api_key: null`, because the secret is never stored in plaintext.
        There is deliberately no merchant-facing endpoint to create keys.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                label: { type: string, maxLength: 100 }
                expires_at: { type: [string, 'null'], format: date-time }
      responses:
        '201':
          description: Key issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKeyCreated' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /ops/api-keys/{id}/revoke:
    post:
      tags: [ops]
      operationId: revokeMerchantApiKey
      summary: Revoke an API key (idempotent; reason audited)
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 10 }
      responses:
        '200':
          description: Revoked (a repeated revoke returns the original revoked_at).
          content:
            application/json:
              schema:
                type: object
                required: [id, prefix, revoked_at]
                properties:
                  id: { type: string, format: uuid }
                  prefix: { type: string }
                  revoked_at: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /topups:
    post:
      tags: [topups]
      operationId: createTopup
      summary: Start a top-up (creates a provider checkout session; never credits the wallet)
      description: |
        Recovery-point pattern (ADR-L02 b): tx1 stores the top-up (recovery_point CREATED) and the
        idempotency key with no response → the provider is called OUTSIDE any DB transaction with
        Idempotency-Key = topup id → tx2 stores provider_ref + checkout_url and the response atomically.

        If the provider times out or fails, the response is 201 with `checkout_url: null` and is NOT
        stored: retrying with the same Idempotency-Key resumes the same top-up from its recovery point
        (the provider returns the same charge). The wallet is credited only when the worker processes
        a verified `charge.succeeded` webhook.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [amount, currency]
              properties:
                amount: { $ref: '#/components/schemas/Money' }
                currency: { $ref: '#/components/schemas/Currency' }
              description: "`amount` between 1000000 (Rp10.000) and 1000000000 (Rp10.000.000) minor units."
      responses:
        '201':
          description: Top-up created (or resumed / replayed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopUp' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /topups/{id}:
    get:
      tags: [topups]
      operationId: getTopup
      summary: Poll a top-up (owner only)
      description: EXPIRED is a soft status — a late successful webhook can still turn it into SUCCEEDED.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Top-up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopUp' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

  /webhooks/provider:
    post:
      tags: [webhooks]
      operationId: receiveProviderWebhook
      summary: Receive a provider event (verify, store, 200 — no business effect here)
      description: |
        1. raw body is read before JSON parsing; 2. `Provider-Signature: t=<unix>,v1=<hex>` with
        HMAC-SHA256(secret, t + "." + raw_body), constant-time compare (several v1 / secrets allowed
        during rotation) → 401 INVALID_SIGNATURE; 3. |now − t| ≤ 300 s → else 400 STALE_WEBHOOK;
        4. INSERT into the inbox, deduplicated on the event id (a duplicate is still 200 so the provider
        stops retrying). A worker applies monotonic transitions and re-fetches the charge from the
        provider before crediting (verify-by-fetch).
      security: []
      parameters:
        - name: Provider-Signature
          in: header
          required: true
          schema: { type: string, example: 't=1790946000,v1=5f2b…' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type, data]
              properties:
                id: { type: string, description: 'Event id; stable across provider retries.' }
                type: { type: string, enum: [charge.succeeded, charge.failed, charge.pending] }
                created_at: { type: string, format: date-time }
                data:
                  type: object
                  properties:
                    charge_id: { type: string }
                    reference: { type: string, description: The LedgerPay top-up id. }
                    amount: { $ref: '#/components/schemas/Money' }
                    currency: { $ref: '#/components/schemas/Currency' }
                    status: { type: string }
      responses:
        '200':
          description: 'Stored (or already stored: response has duplicate = true).'
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  duplicate: { type: boolean }
        '400':
          description: STALE_WEBHOOK or MALFORMED_JSON.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: INVALID_SIGNATURE.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /payouts:
    post:
      tags: [payouts]
      operationId: createPayout
      summary: Withdraw to a bank account (funds held immediately; bank called by a worker)
      description: |
        One transaction: idempotency key → hold journal (DR wallet / CR PAYOUT_IN_TRANSIT) →
        payout PENDING (account number encrypted at rest) → job `payout.submit` (outbox). No bank
        call happens in this request, hence 202. Stored for replay: 202 and 422.

        The worker commits SUBMITTED before calling the bank. A timeout, 5xx, crash, or a success
        response that does not match the local record makes the payout UNKNOWN; it is resolved by
        status queries (30s, 2m, 10m, 1h, 6h), never by a blind resubmit or an automatic reversal.
        Users see `display_status: PROCESSING` until the outcome is final.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePayoutRequest' }
      responses:
        '202':
          description: Payout accepted (or replayed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /payouts/{id}:
    get:
      tags: [payouts]
      operationId: getPayout
      summary: Get a payout (owner only)
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Payout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payout' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    userJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token (15 minutes), kept in memory by the SPA.
    refreshCookie:
      type: apiKey
      in: cookie
      name: lp_refresh
      description: Opaque refresh token, rotated on every use with reuse detection.
    merchantApiKey:
      type: http
      scheme: bearer
      bearerFormat: lp_test_<prefix8>_<secret32>
      description: Merchant API key issued by ops. Stored server-side as SHA-256 only.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key; same key + same payload = same result.
      schema: { type: string, minLength: 8, maxLength: 255, pattern: '^[A-Za-z0-9_\-:.]{8,255}$' }
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: CSRF guard for cookie-authenticated endpoints. Must be `fetch`.
      schema: { type: string, enum: [fetch] }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `page.next_cursor`.
      schema: { type: string }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Money:
      type: string
      description: Integer amount in minor units, as a string (no floats). IDR exponent 2.
      pattern: '^[0-9]{1,18}$'
      examples: ['5000000']
    Currency:
      type: string
      enum: [IDR]
    Page:
      type: object
      required: [has_more]
      properties:
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }
    Problem:
      type: object
      description: RFC 9457 Problem Details with a stable machine-readable code.
      required: [type, title, status, code, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string, examples: [INSUFFICIENT_BALANCE] }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }
        errors:
          type: array
          description: Field-level errors, only for VALIDATION_ERROR.
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
        existing_resource_id:
          type: string
          format: uuid
          description: Only for DUPLICATE_MERCHANT_ORDER — the live intent for that order.
        refundable_amount:
          $ref: '#/components/schemas/Money'
          description: Only for REFUND_EXCEEDS_PAYMENT — what can still be refunded.
    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128, writeOnly: true }
        display_name: { type: string, minLength: 1, maxLength: 80 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, writeOnly: true }
    AccessToken:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, description: Seconds until expiry. }
    User:
      type: object
      required: [id, email, display_name, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string }
        created_at: { type: string, format: date-time }
    Wallet:
      type: object
      required: [account_id, currency, balance, status, as_of]
      properties:
        account_id: { type: string, format: uuid }
        currency: { $ref: '#/components/schemas/Currency' }
        balance: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [ACTIVE, FROZEN] }
        as_of: { type: string, format: date-time }
    WalletTransaction:
      type: object
      required: [id, type, direction, amount, currency, status, created_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [TOPUP, TRANSFER, PAYMENT, REFUND, PAYOUT, ADJUSTMENT] }
        direction: { type: string, enum: [IN, OUT] }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { type: string }
        journal_id: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
    WalletTransactionDetail:
      allOf:
        - $ref: '#/components/schemas/WalletTransaction'
        - type: object
          required: [journal]
          properties:
            journal:
              type: object
              required: [id, purpose, created_at, entries]
              properties:
                id: { type: string, format: uuid }
                purpose: { type: string }
                created_at: { type: string, format: date-time }
                entries:
                  type: array
                  description: Other parties' accounts are labeled generically; their IDs are never exposed.
                  items:
                    type: object
                    required: [side, amount, account_label]
                    properties:
                      side: { type: string, enum: [D, C] }
                      amount: { $ref: '#/components/schemas/Money' }
                      account_label: { type: string, enum: [Wallet Anda, Wallet pengguna lain, Sistem] }
    CreateTransferRequest:
      type: object
      required: [recipient_email, amount, currency]
      properties:
        recipient_email: { type: string, format: email }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        note: { type: string, maxLength: 140 }
      description: "`amount` between 100 (Rp1) and 1000000000 (Rp10.000.000) minor units."
    Party:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string }
    CreatePaymentIntentRequest:
      type: object
      additionalProperties: false
      required: [merchant_order_id, amount, currency]
      properties:
        merchant_order_id: { type: string, pattern: '^[A-Za-z0-9_\-.:/]{1,64}$' }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        description: { type: string, maxLength: 200 }
        expires_in_seconds: { type: integer, minimum: 300, maximum: 86400, default: 1800 }
      description: "`amount` between 100 and 10000000000 minor units (Rp100.000.000)."
    PaymentIntent:
      type: object
      description: |
        Fields depend on the viewer (docs/design/13-api-endpoints.md §2.6): the merchant sees
        `merchant.id`, `checkout_url` and `payer.display_name`; the payer sees payment details;
        a viewer before payment sees checkout data only.
      required: [id, merchant, merchant_order_id, amount, currency, status, expires_at]
      properties:
        id: { type: string, format: uuid }
        merchant:
          type: object
          required: [name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        merchant_order_id: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [REQUIRES_CONFIRMATION, SUCCEEDED, PARTIALLY_REFUNDED, REFUNDED, EXPIRED, CANCELLED] }
        refunded_amount: { $ref: '#/components/schemas/Money' }
        checkout_url: { type: string, format: uri }
        payer: { $ref: '#/components/schemas/Party' }
        refunds: { type: array, items: { $ref: '#/components/schemas/Refund' }, description: Paid intents only (merchant and payer views). }
        expires_at: { type: string, format: date-time }
        confirmed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    ApiKeyCreated:
      type: object
      required: [id, prefix, slot, api_key, created_at]
      properties:
        id: { type: string, format: uuid }
        prefix: { type: string, pattern: '^[a-f0-9]{8}$' }
        slot: { type: integer, enum: [1, 2] }
        api_key: { type: [string, 'null'], description: Shown once; null on replay. }
        note: { type: string }
        created_at: { type: string, format: date-time }
    Refund:
      type: object
      required: [id, payment_intent_id, amount, currency, reason, journal_id, created_at]
      properties:
        id: { type: string, format: uuid }
        payment_intent_id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        reason: { type: [string, 'null'] }
        journal_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    OpsReason:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 10 }
    OpsJob:
      type: object
      required: [id, status, attempts, run_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        status: { type: string, enum: [queued, running, succeeded, dead] }
        attempts: { type: integer }
        max_attempts: { type: integer }
        last_error: { type: string }
        run_at: { type: string, format: date-time }
        correlation_id: { type: string }
        created_at: { type: string, format: date-time }
    OpsPayout:
      type: object
      required: [id, user, amount, currency, status, destination, hold_journal_id, needs_reconciliation, status_check_attempts, created_at]
      properties:
        id: { type: string, format: uuid }
        user: { type: object, required: [id, email], properties: { id: { type: string, format: uuid }, email: { type: string } } }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { type: string, enum: [PENDING, SUBMITTED, UNKNOWN, SUCCEEDED, FAILED] }
        destination:
          type: object
          properties:
            bank_code: { type: string }
            account_number_masked: { type: string }
            holder_name: { type: string }
        hold_journal_id: { type: string, format: uuid }
        settle_journal_id: { type: [string, 'null'], format: uuid }
        reversal_journal_id: { type: [string, 'null'], format: uuid }
        needs_reconciliation: { type: boolean }
        status_check_attempts: { type: integer }
        last_provider_status: { type: [string, 'null'] }
        last_error: { type: [string, 'null'] }
        resolution_source: { type: [string, 'null'], enum: [BANK_RESPONSE, STATUS_QUERY, RECON, OPS, null] }
        resolved_by: { type: [string, 'null'], format: uuid }
        submitted_at: { type: [string, 'null'], format: date-time }
        resolved_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    ReconRun:
      type: object
      required: [id, provider, business_date, source, status, row_count, matched_count, missing_internal_count, missing_external_count, amount_mismatch_count, status_mismatch_count, started_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        business_date: { type: string, format: date }
        source: { type: string, enum: [PULL, UPLOAD] }
        status: { type: string, enum: [RUNNING, COMPLETED, FAILED] }
        row_count: { type: integer }
        matched_count: { type: integer }
        missing_internal_count: { type: integer }
        missing_external_count: { type: integer }
        amount_mismatch_count: { type: integer }
        status_mismatch_count: { type: integer }
        error: { type: [string, 'null'] }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    ReconItem:
      type: object
      required: [id, source, object_type, category, currency, created_at]
      properties:
        id: { type: string, format: uuid }
        recon_run_id: { type: [string, 'null'], format: uuid }
        source: { type: string, enum: [SETTLEMENT, WEBHOOK] }
        object_type: { type: string, enum: [topup, payout] }
        internal_id: { type: [string, 'null'], format: uuid }
        external_ref: { type: [string, 'null'] }
        provider_ref: { type: [string, 'null'] }
        category: { type: string, enum: [MATCHED, MISSING_INTERNAL, MISSING_EXTERNAL, AMOUNT_MISMATCH, STATUS_MISMATCH] }
        internal_amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        external_amount: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        internal_status: { type: [string, 'null'] }
        external_status: { type: [string, 'null'] }
        currency: { $ref: '#/components/schemas/Currency' }
        resolution: { type: [string, 'null'], enum: [OPEN, RESOLVED, null] }
        resolution_action: { type: [string, 'null'] }
        resolution_note: { type: [string, 'null'] }
        resolved_by: { type: [string, 'null'], format: uuid }
        resolved_at: { type: [string, 'null'], format: date-time }
        settlement_journal_id: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
    CreatePayoutRequest:
      type: object
      additionalProperties: false
      required: [amount, currency, destination]
      properties:
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        destination:
          type: object
          additionalProperties: false
          required: [bank_code, account_number, holder_name]
          properties:
            bank_code: { type: string, enum: [MOCKBANK, BCA, BNI, BRI, MANDIRI] }
            account_number: { type: string, pattern: '^[0-9]{6,20}$' }
            holder_name: { type: string, minLength: 2, maxLength: 100 }
      description: "`amount` between 1000000 (Rp10.000) and 2500000000 (Rp25.000.000) minor units."
    Payout:
      type: object
      required: [id, amount, currency, status, display_status, destination, hold_journal_id, created_at]
      properties:
        id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { type: string, enum: [PENDING, SUBMITTED, UNKNOWN, SUCCEEDED, FAILED] }
        display_status: { type: string, enum: [PROCESSING, SUCCEEDED, FAILED] }
        destination:
          type: object
          required: [bank_code, account_number_masked, holder_name]
          properties:
            bank_code: { type: string }
            account_number_masked: { type: string, example: '******7890' }
            holder_name: { type: string }
        hold_journal_id: { type: string, format: uuid }
        needs_reconciliation: { type: boolean }
        created_at: { type: string, format: date-time }
    TopUp:
      type: object
      required: [id, amount, currency, status, checkout_url, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { type: string, enum: [PENDING, SUCCEEDED, FAILED, EXPIRED] }
        checkout_url:
          type: [string, 'null']
          format: uri
          description: Provider hosted checkout. null while the provider charge is not created yet (retry with the same key).
        failure_reason: { type: string }
        expires_at: { type: string, format: date-time }
        succeeded_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    Transfer:
      type: object
      description: |
        Seen from the caller's side: the sender gets `receiver` and direction OUT; the receiver
        gets `sender` and direction IN. The other party's user id is never exposed.
      required: [id, amount, currency, status, direction, note, journal_id, created_at]
      properties:
        id: { type: string, format: uuid }
        amount: { $ref: '#/components/schemas/Money' }
        currency: { $ref: '#/components/schemas/Currency' }
        status: { type: string, enum: [COMPLETED] }
        direction: { type: string, enum: [IN, OUT] }
        receiver: { $ref: '#/components/schemas/Party' }
        sender: { $ref: '#/components/schemas/Party' }
        note: { type: [string, 'null'] }
        journal_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

  responses:
    ValidationError:
      description: VALIDATION_ERROR, MALFORMED_JSON, INVALID_CURSOR, IDEMPOTENCY_KEY_REQUIRED, or IDEMPOTENCY_KEY_INVALID.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthenticated:
      description: UNAUTHENTICATED, TOKEN_EXPIRED, INVALID_CREDENTIALS, or REFRESH_TOKEN_REUSED.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: FORBIDDEN — missing role (ops) or failed CSRF guard (cookie endpoints).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: NOT_FOUND — the resource does not exist or must not be known to the caller.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: REQUEST_IN_PROGRESS, RESOURCE_BUSY, EMAIL_ALREADY_REGISTERED, INVALID_STATE_TRANSITION, DUPLICATE_MERCHANT_ORDER (with existing_resource_id), or API_KEY_LIMIT_REACHED.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnprocessableEntity:
      description: INSUFFICIENT_BALANCE, SELF_TRANSFER, INVALID_RECIPIENT, ACCOUNT_FROZEN, CURRENCY_NOT_SUPPORTED, PAYMENT_EXPIRED, REFUND_EXCEEDS_PAYMENT (with refundable_amount), RESOLUTION_EVIDENCE_REQUIRED, or IDEMPOTENCY_KEY_REUSED.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: RATE_LIMITED — see Retry-After.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
