# CI untuk PR dan push ke main (docs/design/25-cicd.md). Sprint 1: empat job wajib
# (lint, unit, integration, migration) + lint workflow/OpenAPI dari Sprint 0.
# Semua action di-pin ke commit SHA (C-27); komentar menunjukkan tag aslinya.
name: pr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: golangci-lint (gosec, depguard, ...)
        run: |
          "$(go env GOPATH)/bin/golangci-lint" run ./...
      - name: Generated code is up to date (sqlc)
        run: |
          "$(go env GOPATH)/bin/sqlc" generate
          git diff --exit-code -- internal/

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Unit tests (race detector, no Docker)
        run: go test -race -short ./...

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Integration tests (Postgres via testcontainers, race detector)
        run: go test -race -count=1 -tags testhooks ./internal/...

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Migrations up-from-zero + catalogue checks
        run: go test -race -count=1 ./db/...

  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

  lint-openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Redocly lint
        run: npx --yes @redocly/cli@1 lint api/openapi.yaml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Typecheck, unit test, build
        run: |
          yarn typecheck
          yarn test:unit
          yarn build

  # E2E (Sprint 5 DoD): stack compose sungguhan (api + worker + mock-provider + postgres) + Playwright.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - name: Start stack
        run: docker compose -f deploy/compose.yml up -d --build --wait api worker mock-provider
      - name: Install frontend + browser
        working-directory: web
        run: |
          yarn install --frozen-lockfile
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: web
        env:
          CI: "true"
          LP_HTTP_PORT: "8080"
        run: yarn e2e
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yml logs --no-color api worker mock-provider | tail -300
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
