# Nightly (docs/design/25-cicd.md §7):
#   demo-verify    setiap malam: stack compose efemeral + semua demo headless (assert + ledger-verify).
#                  Gagal = demo live berisiko gagal saat interview.
#   restore-drill  mingguan (Senin): backup terbaru dari offsite → dekripsi (key drill) → Postgres sekali
#                  pakai → migrate → verify. Gagal = RPO yang diklaim palsu. Aktif kalau BACKUP_REMOTE di-set.
name: nightly

on:
  schedule:
    - cron: "0 19 * * *" # 02:00 WIB
    - cron: "0 20 * * 1" # Senin 03:00 WIB
  workflow_dispatch:
    inputs:
      job:
        description: "demo-verify | restore-drill"
        required: true
        default: demo-verify
        type: choice
        options: [demo-verify, restore-drill]

permissions:
  contents: read

jobs:
  demo-verify:
    if: github.event_name == 'schedule' && github.event.schedule == '0 19 * * *' || inputs.job == 'demo-verify'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Start stack
        run: docker compose -f deploy/compose.yml up -d --build --wait api worker mock-provider
      - name: Demo A, B, C, payment, top-up, ops (assert + ledger-verify)
        run: make demo-verify
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yml logs --no-color api worker mock-provider | tail -300

  restore-drill:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 20 * * 1' || inputs.job == 'restore-drill') && vars.BACKUP_REMOTE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKUP_REMOTE: ${{ vars.BACKUP_REMOTE }} # contoh offsite:ledgerpay-backups/daily
      # Kredensial READ-ONLY (berbeda dari kredensial write-only di VM).
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${{ vars.BACKUP_S3_PROVIDER }}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${{ secrets.BACKUP_READ_ACCESS_KEY_ID }}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_READ_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build backup image (rclone, age, pg_restore 17)
        run: docker build -q -f deploy/backup/Dockerfile -t ledgerpay-backup:drill . >/dev/null
      - name: Download latest backup + checksum
        run: |
          mkdir -p drill && chmod 777 drill
          rc() { docker run --rm --entrypoint rclone -v "$PWD/drill:/drill" \
            -e RCLONE_CONFIG_OFFSITE_TYPE -e RCLONE_CONFIG_OFFSITE_PROVIDER -e RCLONE_CONFIG_OFFSITE_ENDPOINT \
            -e RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID -e RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY ledgerpay-backup:drill "$@"; }
          latest=$(rc lsf --files-only "$BACKUP_REMOTE" | grep '\.dump\.age$' | sort | tail -1)
          [ -n "$latest" ] || { echo "no backup found in $BACKUP_REMOTE"; exit 1; }
          rc copy "$BACKUP_REMOTE/$latest" /drill/ && rc copy "$BACKUP_REMOTE/$latest.sha256" /drill/
          echo "BACKUP_FILE=drill/$latest" >> "$GITHUB_ENV"
      - name: Restore + migrate + verify
        env:
          RESTORE_DRILL_AGE_KEY: ${{ secrets.RESTORE_DRILL_AGE_KEY }}
          LP_BACKUP_IMAGE: ledgerpay-backup:drill
        run: |
          umask 077 && printf '%s\n' "$RESTORE_DRILL_AGE_KEY" > "$RUNNER_TEMP/drill.key" && chmod 644 "$RUNNER_TEMP/drill.key"
          scripts/restore-drill.sh "$BACKUP_FILE" "$RUNNER_TEMP/drill.key" | tee drill.log
          tail -1 drill.log >> "$GITHUB_STEP_SUMMARY"
