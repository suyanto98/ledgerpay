<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>LedgerPay Web — Riwayat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1D5BD8}a:hover{color:#0B2559}
button,input,select{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="min-height: 980px; background: #F3F5F9; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #0F172A; display: flex; flex-wrap: wrap">

  <aside style="flex: 1 1 248px; max-width: 100%; background: #0B2559; color: #FFFFFF; padding: 24px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">
    <a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF; padding: 0 8px">
      <span style="width: 36px; height: 36px; border-radius: 10px; background: #FFFFFF; color: #0B2559; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"></path><path d="M8 14l4-4 3 3 5-5"></path></svg></span>
      <span style="font-size: 18px; font-weight: 800">LedgerPay</span>
    </a>
    <nav aria-label="Menu utama" style="display: flex; flex-direction: column; gap: 4px">
      <a href="Dashboard.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; color: #C9D4EC; text-decoration: none; font-size: 14px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Beranda</a>
      <a href="Transfer.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; color: #C9D4EC; text-decoration: none; font-size: 14px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"></path></svg>Transfer</a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; color: #C9D4EC; text-decoration: none; font-size: 14px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>Top-up</a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; color: #C9D4EC; text-decoration: none; font-size: 14px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18M5 10V20M19 10V20M9 10v10M15 10v10M3 20h18M12 3l9 5H3z"></path></svg>Tarik dana</a>
      <a href="History.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; background: rgba(255,255,255,0.12); color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>Riwayat</a>
    </nav>
    <div style="display: flex; flex-direction: column; gap: 4px; border-top: 1px solid rgba(255,255,255,0.14); padding-top: 16px">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.8px; color: #8FA2CC; padding: 0 12px 6px">OPERASIONAL</span>
      <a href="Ops.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; color: #C9D4EC; text-decoration: none; font-size: 14px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path></svg>Ops console</a>
    </div>
    <div style="flex: 1"></div>
    <a href="Login.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; color: #C9D4EC; text-decoration: none; font-size: 14px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>Keluar</a>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <header style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end; max-width: 1200px; width: 100%">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.4px">Riwayat transaksi</h1>
        <span style="font-size: 14px; color: #5B6478">Semua mutasi wallet 8810 2241 0193</span>
      </div>
      <button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #D5DBE6; background: #FFFFFF; color: #0B2559; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>Unduh CSV</button>
    </header>

    <section aria-label="Filter" style="max-width: 1200px; width: 100%; box-sizing: border-box; background: #FFFFFF; border-radius: 18px; padding: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end">
      <div style="flex: 2 1 240px; display: flex; flex-direction: column; gap: 6px">
        <label for="q" style="font-size: 12px; font-weight: 600; color: #3A4458">Cari</label>
        <div style="height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; border: 1.5px solid #D5DBE6; border-radius: 12px; padding: 0 12px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6478" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <input id="q" type="text" placeholder="Nama, email, atau no. referensi" style="flex: 1; min-width: 0; border: none; outline: none; font-size: 14px; background: transparent; cursor: text">
        </div>
      </div>
      <div style="flex: 1 1 160px; display: flex; flex-direction: column; gap: 6px">
        <label for="type" style="font-size: 12px; font-weight: 600; color: #3A4458">Jenis</label>
        <select id="type" style="height: 44px; border: 1.5px solid #D5DBE6; border-radius: 12px; padding: 0 12px; font-size: 14px; background: #FFFFFF; color: #0F172A"><option>Semua jenis</option><option>Transfer</option><option>Top-up</option><option>Tarik dana</option><option>Pembayaran</option><option>Refund</option></select>
      </div>
      <div style="flex: 1 1 160px; display: flex; flex-direction: column; gap: 6px">
        <label for="status" style="font-size: 12px; font-weight: 600; color: #3A4458">Status</label>
        <select id="status" style="height: 44px; border: 1.5px solid #D5DBE6; border-radius: 12px; padding: 0 12px; font-size: 14px; background: #FFFFFF; color: #0F172A"><option>Semua status</option><option>Berhasil</option><option>Diproses</option><option>Gagal</option></select>
      </div>
      <div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px">
        <label for="range" style="font-size: 12px; font-weight: 600; color: #3A4458">Periode</label>
        <select id="range" style="height: 44px; border: 1.5px solid #D5DBE6; border-radius: 12px; padding: 0 12px; font-size: 14px; background: #FFFFFF; color: #0F172A"><option>30 hari terakhir</option><option>7 hari terakhir</option><option>Bulan ini</option><option>Pilih tanggal…</option></select>
      </div>
    </section>

    <section style="max-width: 1200px; width: 100%; box-sizing: border-box; background: #FFFFFF; border-radius: 18px; display: flex; flex-direction: column">
      <div style="overflow-x: auto">
        <table style="width: 100%; min-width: 820px; border-collapse: collapse; font-size: 14px">
          <thead>
            <tr style="text-align: left; color: #5B6478; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px">
              <th style="padding: 14px 24px; font-weight: 700; border-bottom: 1px solid #EEF1F6">Tanggal</th>
              <th style="padding: 14px 16px; font-weight: 700; border-bottom: 1px solid #EEF1F6">Keterangan</th>
              <th style="padding: 14px 16px; font-weight: 700; border-bottom: 1px solid #EEF1F6">Jenis</th>
              <th style="padding: 14px 16px; font-weight: 700; border-bottom: 1px solid #EEF1F6">Status</th>
              <th style="padding: 14px 24px; font-weight: 700; border-bottom: 1px solid #EEF1F6; text-align: right">Nominal</th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
              <tr>
                <td style="padding: 14px 24px; border-bottom: 1px solid #F1F3F8; white-space: nowrap"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{r.date}}</span><span style="font-size: 12px; color: #5B6478">{{r.time}}</span></span></td>
                <td style="padding: 14px 16px; border-bottom: 1px solid #F1F3F8"><span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{r.title}}</span><span style="font-size: 12px; color: #5B6478; font-family: ui-monospace, Menlo, monospace">{{r.ref}}</span></span></td>
                <td style="padding: 14px 16px; border-bottom: 1px solid #F1F3F8; color: #3A4458">{{r.kind}}</td>
                <td style="padding: 14px 16px; border-bottom: 1px solid #F1F3F8"><span style="font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: {{r.chipBg}}; color: {{r.chipFg}}; white-space: nowrap">{{r.status}}</span></td>
                <td style="padding: 14px 24px; border-bottom: 1px solid #F1F3F8; text-align: right; font-weight: 700; color: {{r.amtColor}}; font-variant-numeric: tabular-nums; white-space: nowrap">{{r.amount}}</td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding: 14px 24px">
        <span style="font-size: 13px; color: #5B6478">Menampilkan 1–8</span>
        <div style="display: flex; gap: 8px">
          <button type="button" disabled="disabled" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #E3E7EF; background: #F3F5F9; color: #5B6478; font-size: 13px; font-weight: 600; cursor: not-allowed">Sebelumnya</button>
          <button type="button" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #D5DBE6; background: #FFFFFF; color: #0B2559; font-size: 13px; font-weight: 700">Berikutnya</button>
        </div>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = { chipBg: '#E3F4EC', chipFg: '#0B6640', status: 'Berhasil' };
    const wait = { chipBg: '#FFF1D6', chipFg: '#7A4300', status: 'Diproses' };
    const fail = { chipBg: '#FDE7E7', chipFg: '#9B1C1C', status: 'Gagal' };
    const out = '#0F172A', inc = '#0B6640', none = '#5B6478';

      rows: [
        { ...ok, date: '6 Okt 2026', time: '09.42', title: 'Budi Santoso', ref: '01A1-1037-520E', kind: 'Transfer keluar', amount: '− Rp 50.000', amtColor: out },
        { ...wait, date: '6 Okt 2026', time: '08.15', title: 'Rekening •••• 4821', ref: '01A1-0F22-91C4', kind: 'Tarik dana', amount: '− Rp 25.000', amtColor: out },
        { ...ok, date: '5 Okt 2026', time: '19.03', title: 'Virtual Account', ref: '01A0-FE10-33B2', kind: 'Top-up', amount: '+ Rp 100.000', amtColor: inc },
        { ...ok, date: '3 Okt 2026', time: '14.20', title: 'Toko Kopi Senja', ref: '01A0-E812-0A7D', kind: 'Refund', amount: '+ Rp 18.000', amtColor: inc },
        { ...ok, date: '3 Okt 2026', time: '12.05', title: 'Toko Kopi Senja', ref: '01A0-E7F9-6C10', kind: 'Pembayaran', amount: '− Rp 18.000', amtColor: out },
        { ...fail, date: '2 Okt 2026', time: '16.48', title: 'Sari Wulandari', ref: '01A0-D3A1-77E8', kind: 'Transfer keluar', amount: 'Rp 200.000', amtColor: none },
        { ...ok, date: '2 Okt 2026', time: '10.11', title: 'Dewi Pratiwi', ref: '01A0-D10C-2F95', kind: 'Transfer masuk', amount: '+ Rp 25.000', amtColor: inc },
        { ...ok, date: '1 Okt 2026', time: '08.30', title: 'Virtual Account', ref: '01A0-C4B7-1E03', kind: 'Top-up', amount: '+ Rp 50.000', amtColor: inc },
      ],
    };
  }
}
</script>
</body>
</html>
