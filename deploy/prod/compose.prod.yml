# Compose untuk VM demo publik (Sprint 7, deploy manual). Dijalankan oleh remote-deploy.sh:
#   docker compose -p ledgerpay-prod -f deploy/prod/compose.prod.yml ...
# Secret TIDAK ada di file ini: setiap service membaca env_file miliknya sendiri di $LP_ENV_DIR
# (dibuat init-env.sh, mode 0600). DSN owner HANYA untuk migrate.
name: ledgerpay-prod

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

networks:
  default: {}
  edge:
    external: true   # dibuat bootstrap (docker network create edge); dipakai bersama stack PayRun

services:
  postgres:
    image: postgres:17-alpine
    env_file: ${LP_ENV_DIR:?}/postgres.env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledgerpay"]
      interval: 2s
      timeout: 3s
      retries: 30
    # VM 2 vCPU / 4 GB untuk DUA project: buffer kecil, cukup untuk data demo.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "effective_cache_size=512MB",
              "-c", "work_mem=4MB", "-c", "maintenance_work_mem=64MB"]
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512m } } }

  migrate:
    build: { context: ../.., dockerfile: deploy/Dockerfile, target: ledgerpay, args: { VERSION: "${LP_VERSION:?}", BUILD_TAGS: demo } }
    image: ${LP_IMAGE_PREFIX:-}ledgerpay-app:${LP_VERSION:?}
    command: ["migrate", "up"]
    env_file: ${LP_ENV_DIR:?}/migrate.env
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"
    profiles: [migrate]

  api:
    image: ${LP_IMAGE_PREFIX:-}ledgerpay-app:${LP_VERSION:?}
    command: ["api"]
    env_file: ${LP_ENV_DIR:?}/api.env
    environment: { APP_VERSION: "${LP_VERSION:?}" }
    depends_on: { postgres: { condition: service_healthy } }
    <<: *hardening
    deploy: { resources: { limits: { memory: 384m } } }

  worker:
    image: ${LP_IMAGE_PREFIX:-}ledgerpay-app:${LP_VERSION:?}
    command: ["worker"]
    env_file: ${LP_ENV_DIR:?}/worker.env
    environment: { APP_VERSION: "${LP_VERSION:?}" }
    depends_on: { postgres: { condition: service_healthy } }
    stop_grace_period: 30s
    <<: *hardening
    deploy: { resources: { limits: { memory: 384m } } }

  mock-provider:
    build: { context: ../.., dockerfile: deploy/Dockerfile, target: mock-provider }
    image: ${LP_IMAGE_PREFIX:-}ledgerpay-mock:${LP_VERSION:?}
    env_file: ${LP_ENV_DIR:?}/mock.env
    ports: ["127.0.0.1:${LP_MOCK_ADMIN_PORT:-9091}:9090"]   # /admin/* hanya dari VM itu sendiri (skrip demo)
    <<: *hardening
    deploy: { resources: { limits: { memory: 128m } } }

  edge:
    build: { context: ../.., dockerfile: deploy/prod/edge.Dockerfile }
    image: ${LP_IMAGE_PREFIX:-}ledgerpay-edge:${LP_VERSION:?}
    env_file: ${LP_ENV_DIR:?}/edge.env
    ports:
      - "${LP_HTTP_PUBLIC_PORT:-80}:80"
      - "${LP_HTTPS_PUBLIC_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ${LP_EDGE_SITES:-/srv/edge/sites}:/etc/caddy/sites:ro   # site PayRun (edge bersama)
    networks: [default, edge]   # `edge`: upstream PayRun (payrun-api, payrun-web, payrun-storage)
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # satu-satunya pengecualian: bind port 80/443
    restart: unless-stopped
    depends_on: [api, mock-provider]
    deploy: { resources: { limits: { memory: 128m } } }

  # Backup harian (cron host 02:00 UTC → run-backup.sh → `run --rm backup`). Role read-only, output
  # terenkripsi age, disimpan di host (bertahan dari `compose down -v`) + offsite kalau dikonfigurasi.
  backup:
    build: { context: ../.., dockerfile: deploy/backup/Dockerfile }
    image: ${LP_IMAGE_PREFIX:-}ledgerpay-backup:${LP_VERSION:?}
    env_file: ${LP_ENV_DIR:?}/backup.env
    volumes: ["${LP_BACKUP_HOST_DIR:-/srv/ledgerpay/backups}:/backups"]
    depends_on: { postgres: { condition: service_healthy } }
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: "no"
    profiles: [backup]

  # Batch job (backup) tidak bisa di-scrape: ia mendorong metrik ke sini, Prometheus men-scrape-nya.
  pushgateway:
    image: prom/pushgateway:v1.11.1
    <<: *hardening
    deploy: { resources: { limits: { memory: 64m } } }

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - promdata:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:9095:9090"]   # SSH tunnel
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256m } } }

  grafana:
    image: grafana/grafana:12.1.1
    env_file: ${LP_ENV_DIR:?}/grafana.env
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 256m } } }

  # Tracing opsional (LP_TRACING=1 saat init-env + deploy): Jaeger menyimpan trace di memori, terlalu
  # mahal untuk VM 4 GB yang dipakai dua project kalau hidup terus.
  jaeger:
    image: jaegertracing/jaeger:2.9.0
    profiles: [tracing]
    ports: ["127.0.0.1:16686:16686"]   # SSH tunnel; UI Jaeger tidak punya autentikasi
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 512m } } }

volumes:
  pgdata:
  promdata:
  grafanadata:
  caddy_data:
  caddy_config:
