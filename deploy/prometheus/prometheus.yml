# Prometheus untuk profile compose `obs` (docs/design/21-observability.md).
# Scrape port OPS internal (9090) api dan worker; port ini tidak pernah diekspos Caddy.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: ledgerpay-api
    static_configs: [{ targets: ["api:9090"], labels: { service: api } }]
  - job_name: ledgerpay-worker
    static_configs: [{ targets: ["worker:9090"], labels: { service: worker } }]
  # Metrik batch job (backup). honor_labels: label job/db dari pendorong dipertahankan.
  - job_name: pushgateway
    honor_labels: true
    static_configs: [{ targets: ["pushgateway:9091"] }]
